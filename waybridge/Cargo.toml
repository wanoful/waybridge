[package]
name = "waybridge"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A headless Wayland compositor with native remote application windows"

[dependencies]
waybridge-codec = { path = "native" }
anyhow = "1"
libc = "0.2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "backend_egl", "renderer_gl", "backend_drm", "xwayland"] }
tempfile = "3"
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[profile.release]
lto = "thin"

[workspace]
members = ["native"]
exclude = ["vendor/smithay"]
resolver = "2"

[patch.crates-io]
smithay = { path = "vendor/smithay" }
