[package]
name = "waybridge"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A headless Wayland compositor with native remote application windows"

[dependencies]
waybridge-codec = { path = "native" }
waybridge-config = { path = "config" }
anyhow = "1"
libc = "0.2"
fuser = "0.16"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "backend_egl", "renderer_gl", "backend_drm", "xwayland"] }
tempfile = "3"
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5.19"
x11rb = "0.13.2"


[profile.release]
lto = "thin"

[workspace]
members = ["native", "service", "config"]
resolver = "2"

[patch.crates-io]
smithay = { git = "https://github.com/wanoful/waybridge-smithay.git", rev = "7a43d67f26b9c738f8cd0c44a09b7b805426bbc7" }

[[example]]
name = "xdnd-source-probe"
path = "tests/fixtures/xdnd_source_probe.rs"

[[example]]
name = "xdnd-protocol-probe"
path = "tests/fixtures/xdnd_protocol_probe.rs"
